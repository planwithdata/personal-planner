name: Deploy Daylight to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.DAYLIGHT_GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.DAYLIGHT_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DAYLIGHT_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:accounts
      - run: npm run test:browser -- --grep mobile
        env:
          DAYLIGHT_TEST_WEBKIT: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
